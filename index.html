/*  I colori sono gli stessi della web app di configurazione, così passare
    dall'una all'altra non sembra cambiare sito.                              */
:root {
    color-scheme: light;
    --bg: #eef0f4;
    --surface: #ffffff;
    --surface-2: #f6f7f9;
    --surface-3: #e9ecf1;
    --border: #d3d8e0;
    --border-strong: #b9c0cc;
    --text: #1c2230;
    --muted: #556070;
    --faint: #8b94a3;
    --accent: #0a7fc2;
    --accent-soft: rgba(10, 127, 194, 0.12);
    --focus: 0 0 0 3px rgba(10, 127, 194, 0.35);
    --link: #0a6fb0;
    --shadow: 0 1px 2px rgba(20, 28, 45, 0.06), 0 2px 6px rgba(20, 28, 45, 0.06);
    --shadow-pop: 0 10px 30px rgba(20, 28, 45, 0.22);
    --card-lift: 0 10px 26px rgba(20, 28, 45, 0.14);
    --radius: 8px;
    --control-h: 32px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
/* Le stesse variabili valgono in due casi: sistema scuro senza una scelta
   esplicita di chiaro, e scelta esplicita di scuro. In CSS puro i due
   selettori non si possono unire, quindi il blocco è ripetuto. */
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14161b;
        --surface: #1d2027;
        --surface-2: #252932;
        --surface-3: #2d323c;
        --border: #363b47;
        --border-strong: #4a5160;
        --text: #e6e8ed;
        --muted: #a6aebb;
        --faint: #767f8f;
        --accent: #2fa6e4;
        --accent-soft: rgba(47, 166, 228, 0.16);
        --focus: 0 0 0 3px rgba(47, 166, 228, 0.4);
        --link: #8ab4f8;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
        --shadow-pop: 0 12px 34px rgba(0, 0, 0, 0.55);
        --card-lift: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161b;
    --surface: #1d2027;
    --surface-2: #252932;
    --surface-3: #2d323c;
    --border: #363b47;
    --border-strong: #4a5160;
    --text: #e6e8ed;
    --muted: #a6aebb;
    --faint: #767f8f;
    --accent: #2fa6e4;
    --accent-soft: rgba(47, 166, 228, 0.16);
    --focus: 0 0 0 3px rgba(47, 166, 228, 0.4);
    --link: #8ab4f8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
    --shadow-pop: 0 12px 34px rgba(0, 0, 0, 0.55);
    --card-lift: 0 12px 30px rgba(0, 0, 0, 0.5);
}

/* ----- Base --------------------------------------------------------------------- */
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
}
a { color: var(--link); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }

.icon {
    width: 20px; height: 20px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
}

/* ----- Barra superiore ----------------------------------------------------------- */
.topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}
.topbar .spacer { flex: 1; }
/* I comandi stanno su una riga flex: così restano allineati fra loro e
   distanziati. Impilati in linea si allineerebbero alla base del testo, e il
   menu del tema finirebbe più in alto del selettore della lingua. */
.topbar .controls { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand svg { width: 24px; height: 24px; display: block; border-radius: 5px; }
.brand-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; }

.control {
    height: var(--control-h);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
}
.control:hover { background: var(--surface-3); border-color: var(--border-strong); }
select.control { padding-right: 4px; min-height: 30px; font-size: 13px; }
.control .icon { width: 18px; height: 18px; }
.theme-button .caret { width: 10px; height: 10px; stroke-width: 2.4; }

.theme-wrap { position: relative; display: flex; }
.theme-menu {
    position: absolute; right: 0; top: calc(100% + 4px);
    min-width: 172px; padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-pop);
    display: none; flex-direction: column; gap: 2px;
    z-index: 5;
}
.theme-menu[data-open="true"] { display: flex; }
.theme-menu button {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 10px;
    background: none; border: 0; border-radius: 6px;
    text-align: left; cursor: pointer; font-size: 14px;
}
.theme-menu button:hover { background: var(--accent-soft); }
.theme-menu button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
.theme-menu .tick { margin-left: auto; width: 16px; height: 16px; opacity: 0; }
.theme-menu button[aria-checked="true"] .tick { opacity: 1; }

/* ----- Impaginazione ------------------------------------------------------------- */
main { flex: 1; width: 100%; max-width: 920px; margin: 0 auto; padding: 0 16px 48px; }

/* ----- Apertura ------------------------------------------------------------------ */
.hero { padding: 44px 0 34px; text-align: center; position: relative; }
/* Il bagliore resta dentro la pagina: allargarlo oltre i bordi farebbe
   comparire la barra di scorrimento orizzontale. */
.hero::before {
    content: ""; position: absolute; inset: -40px 0 auto; height: 260px;
    background: radial-gradient(85% 75% at 50% 0%, var(--accent-soft), transparent 72%);
    pointer-events: none;
}
.hero-mark {
    position: relative;
    width: 64px; height: 64px; margin: 0 auto 16px;
    border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow);
}
.hero-mark svg { width: 100%; height: 100%; display: block; }
.hero h1 {
    margin: 0 0 12px; position: relative;
    font-size: clamp(1.9rem, 5.4vw, 2.8rem);
    line-height: 1.12; letter-spacing: -0.025em;
}
.hero h1 .accent { color: var(--accent); }
.hero p {
    margin: 0 auto; max-width: 58ch; position: relative;
    color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.12rem); line-height: 1.55;
}

/* ----- Punti di forza ------------------------------------------------------------ */
.points { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 30px 0 6px; }
@media (min-width: 720px) { .points { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
/* I punti stanno dentro .hero, che centra il testo: centriamo anche l'icona,
   altrimenti resta spaiata a sinistra. */
.point { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.point-icon {
    width: 38px; height: 38px; display: grid; place-items: center;
    border-radius: 10px; background: var(--accent-soft); color: var(--accent);
}
.point h2 { margin: 4px 0 0; font-size: 1rem; }
.point p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }

/* ----- Riquadri ------------------------------------------------------------------ */
.cards { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 720px) { .cards { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
.card {
    display: flex; flex-direction: column; gap: 10px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    text-decoration: none; color: inherit;
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
}
.card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: var(--card-lift); border-color: var(--accent); }
.card-top { display: flex; align-items: center; gap: 12px; }
.card-icon {
    width: 42px; height: 42px; flex: none; display: grid; place-items: center;
    border-radius: 10px; background: var(--accent-soft); color: var(--accent);
}
.card-icon .icon { width: 22px; height: 22px; stroke-width: 1.7; }
.card h2 { margin: 0; font-size: 1.08rem; line-height: 1.3; }
.card p { margin: 0; color: var(--muted); font-size: 0.93rem; line-height: 1.5; flex: 1; }
.card-go { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 0.88rem; font-weight: 600; }
.card-go .icon { width: 15px; height: 15px; stroke-width: 2.2; transition: transform 0.14s ease; }
.card:hover .card-go .icon { transform: translateX(3px); }

/* ----- Piede ---------------------------------------------------------------------- */
footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 20px 16px 26px;
    text-align: center;
    color: var(--faint);
    font-size: 0.85rem;
    line-height: 1.6;
}
footer a { color: var(--link); text-decoration: none; }
footer a:hover { text-decoration: underline; }
footer .links { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; margin-bottom: 8px; }

@media (max-width: 560px) {
    .topbar { padding: 6px 10px; gap: 6px; }
    .brand-name { font-size: 0.88rem; }
    .hero { padding: 32px 0 26px; }
}
@media (max-width: 420px) {
    .brand-name { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    .card, .card-go .icon { transition: none; }
    .card:hover, .card:focus-visible { transform: none; }
}
</style>

            piconTitle: 'PICON-AS',
            piconText: 'Componenti, schemi, modelli 3D e guida al montaggio della lightgun di riferimento.',

            footerSource: 'Codice sorgente',
            footerChannel: 'Canale YouTube',
            footerNote: 'Software libero rilasciato sotto licenza GNU General Public License.'
        }
    };

    var LANG_KEY = 'openfire-hub-lang';
    var THEME_KEY = 'openfire-hub-theme';
    var THEMES = ['system', 'light', 'dark'];
    var SVG = 'http://www.w3.org/2000/svg';

    var store = {
        get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* navigazione privata */ } }
    };

    var lang = 'en';
    var theme = 'system';

    function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || ''; }

    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
    }

    function icon(name, cls) {
        var s = document.createElementNS(SVG, 'svg');
        s.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
        s.setAttribute('viewBox', '0 0 24 24');
        s.setAttribute('aria-hidden', 'true');
        var p = document.createElementNS(SVG, 'path');
        p.setAttribute('d', ICONS[name] || '');
        s.appendChild(p);
        return s;
    }

    // ── Lingua ──────────────────────────────────────────────────────────────
    function pickLang() {
        var codes = Object.keys(STRINGS);
        var asked = new URLSearchParams(location.search).get('lang');
        if (asked && codes.indexOf(asked) >= 0) return asked;
        var saved = store.get(LANG_KEY);
        if (saved && codes.indexOf(saved) >= 0) return saved;
        var list = navigator.languages || [navigator.language || ''];
        for (var i = 0; i < list.length; ++i) {
            var short = String(list[i]).toLowerCase().split('-')[0];
            if (codes.indexOf(short) >= 0) return short;
        }
        return 'en';
    }

    // ── Tema ────────────────────────────────────────────────────────────────
    function applyTheme() {
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        else delete document.documentElement.dataset.theme;

        var path = document.querySelector('#theme-button .icon path');
        if (path) path.setAttribute('d', ICONS[theme]);
        var btn = document.getElementById('theme-button');
        if (btn) {
            var label = t('theme') + ': ' + t('theme_' + theme);
            btn.setAttribute('aria-label', label);
            btn.title = label;
        }
        var items = document.querySelectorAll('#theme-menu button');
        for (var i = 0; i < items.length; ++i)
            items[i].setAttribute('aria-checked', String(items[i].dataset.theme === theme));
    }

    // ── Barra superiore ─────────────────────────────────────────────────────
    function buildControls() {
        var bar = document.querySelector('.topbar .controls');
        bar.textContent = '';

        // Tema.
        var wrap = el('span', 'theme-wrap');
        var btn = el('button', 'control theme-button');
        btn.type = 'button';
        btn.id = 'theme-button';
        btn.setAttribute('aria-haspopup', 'true');
        btn.setAttribute('aria-expanded', 'false');
        btn.appendChild(icon('system'));
        var caret = document.createElementNS(SVG, 'svg');
        caret.setAttribute('class', 'icon caret');
        caret.setAttribute('viewBox', '0 0 24 24');
        caret.setAttribute('aria-hidden', 'true');
        var cp = document.createElementNS(SVG, 'path');
        cp.setAttribute('d', 'M6 9l6 6 6-6');
        caret.appendChild(cp);
        btn.appendChild(caret);

        var menu = el('div', 'theme-menu');
        menu.id = 'theme-menu';
        menu.setAttribute('role', 'menu');
        THEMES.forEach(function (name) {
            var b = document.createElement('button');
            b.type = 'button';
            b.setAttribute('role', 'menuitemradio');
            b.dataset.theme = name;
            b.appendChild(icon(name));
            b.appendChild(el('span', null, t('theme_' + name)));
            b.appendChild(icon('check', 'tick'));
            b.addEventListener('click', function () {
                theme = name;
                store.set(THEME_KEY, name);
                applyTheme();
                menu.dataset.open = 'false';
                btn.setAttribute('aria-expanded', 'false');
            });
            menu.appendChild(b);
        });
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = menu.dataset.open !== 'true';
            menu.dataset.open = String(open);
            btn.setAttribute('aria-expanded', String(open));
        });
        wrap.appendChild(btn);
        wrap.appendChild(menu);
        bar.appendChild(wrap);

        // Lingua.
        var sel = document.createElement('select');
        sel.className = 'control';
        sel.id = 'lang-select';
        Object.keys(STRINGS).sort(function (a, b) {
            return STRINGS[a].name.localeCompare(STRINGS[b].name);
        }).forEach(function (code) {
            var o = document.createElement('option');
            o.value = code;
            o.textContent = STRINGS[code].name;
            sel.appendChild(o);
        });
        sel.value = lang;
        sel.setAttribute('aria-label', t('language'));
        sel.title = t('language');
        sel.addEventListener('change', function () {
            lang = sel.value;
            store.set(LANG_KEY, lang);
            render();
        });
        bar.appendChild(sel);
    }

    // ── Riquadri e piede ────────────────────────────────────────────────────
    function buildCards() {
        var box = document.getElementById('cards');
        box.textContent = '';
        CARDS.forEach(function (card) {
            var a = document.createElement('a');
            a.className = 'card';
            a.href = card.lang ? card.url + '?lang=' + lang : card.url;

            var top = el('div', 'card-top');
            var ic = el('span', 'card-icon');
            ic.appendChild(icon(card.icon));
            top.appendChild(ic);
            top.appendChild(el('h2', null, t(card.key + 'Title')));

            var go = el('span', 'card-go');
            go.appendChild(el('span', null, t('open')));
            go.appendChild(icon('arrow'));

            a.appendChild(top);
            a.appendChild(el('p', null, t(card.key + 'Text')));
            a.appendChild(go);
            box.appendChild(a);
        });
    }

    function buildFooter() {
        var box = document.getElementById('footer-links');
        box.textContent = '';
        [[t('footerSource'), REPO], [t('footerChannel'), YOUTUBE]].forEach(function (pair) {
            var a = document.createElement('a');
            a.textContent = pair[0];
            a.href = pair[1];
            box.appendChild(a);
        });
    }

    // ── Applica tutto ───────────────────────────────────────────────────────
    function render() {
        document.documentElement.lang = lang;
        document.title = t('pageTitle');
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute('content', t('pageDescription'));

        var nodes = document.querySelectorAll('[data-t]');
        for (var i = 0; i < nodes.length; ++i) nodes[i].textContent = t(nodes[i].dataset.t);

        buildControls();
        buildCards();
        buildFooter();
        applyTheme();

        // L'indirizzo riflette la lingua mostrata: si può copiare e condividere.
        try {
            var url = new URL(location.href);
            url.searchParams.set('lang', lang);
            history.replaceState(null, '', url);
        } catch (e) { /* file:// o browser senza history */ }
    }

    theme = store.get(THEME_KEY);
    if (THEMES.indexOf(theme) < 0) theme = 'system';
    lang = pickLang();
    render();

    document.addEventListener('click', function () {
        var m = document.getElementById('theme-menu');
        var b = document.getElementById('theme-button');
        if (m) m.dataset.open = 'false';
        if (b) b.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        var m = document.getElementById('theme-menu');
        var b = document.getElementById('theme-button');
        if (m) m.dataset.open = 'false';
        if (b) b.setAttribute('aria-expanded', 'false');
    });
})();
</script>
</body>
</html>
